name: Deploy docs site

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/docs-deploy.yml'
      - 'scripts/generate-update-manifest.ts'
      - 'src/modules/updates/manifest.ts'
      - 'src/modules/updates/version.ts'
  workflow_dispatch:
  workflow_call:
    inputs:
      expected_version:
        description: npm version that must be visible before deployment.
        required: false
        default: ''
        type: string
      expected_channel:
        description: npm dist-tag that must point at the expected version.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy neondeck.dev
    runs-on: ubuntu-latest
    environment: docs-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate release manifest
        run: npm run docs:release-manifest
        env:
          NEONDECK_EXPECTED_RELEASE_VERSION: ${{ inputs.expected_version }}
          NEONDECK_EXPECTED_RELEASE_CHANNEL: ${{ inputs.expected_channel }}

      - name: Build Astro site
        run: npm run docs:build

      - name: Deploy to Cloudflare
        working-directory: docs
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployed release manifest
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://neondeck.dev/latest.json?deployment=${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              | cmp --silent - docs/public/latest.json; then
              exit 0
            fi
            if [ "${attempt}" -eq 12 ]; then
              echo "The deployed release manifest did not match the generated manifest." >&2
              exit 1
            fi
            echo "Cloudflare deployment propagation is pending (attempt ${attempt}/12); retrying in 5 seconds."
            sleep 5
          done
